<script>
// Project card component definition
class projectCard extends HTMLElement {
    constructor() {
        super();
    }
//Note:the appending here is separate from the html thats being created in the load function.
    connectedCallback() {
        const headerText = this.getAttribute('header') || 'HEADER2!';
        const imageSource = this.getAttribute('image') || 'Capture.JPG';
        const descriptionSource = this.getAttribute('alt') || 'description';
        const textDescription = this.getAttribute('p') || 'test';
        const componentHref = this.getAttribute('href') || 'https://example.com';
        
        this.componentHeader = document.createElement('h2');
        this.componentHeader.textContent = headerText;
        this.appendChild(this.componentHeader);

        this.componentPicture = document.createElement('picture')
        
        const img = document.createElement('img');
        img.src = imageSource;
        img.alt = descriptionSource;
        const source = document.createElement('source');
        source.srcset = imageSource
        source.media = "min-width: 200px" //this will be the same for all cards no matter what

        this.componentPicture.appendChild(source)
        this.componentPicture.appendChild(img);
        this.appendChild(this.componentPicture);
        
        this.description = document.createElement('p');
        this.description.textContent = textDescription
        this.appendChild(this.description);
        
        this.componentLink = document.createElement('a');
        this.componentLink.href = componentHref;
        this.componentLink.textContent = 'Click Here for more details';
        this.componentLink.target = '_blank';
        this.appendChild(this.componentLink);
    }
}

function loadProjectsLocal() {
    
    
    const container = document.getElementById('projects-container');
    container.innerHTML = ' <nav class = "nav">      <a href="index.html">Index</a>   </nav> <div id="status"></div>';
    
    // Try to get projects from localStorage
    const storedCard = localStorage.getItem('projectCards');
    
    
    
    let projectData = JSON.parse(storedCard);
        console.log("Loaded from localStorage:", projectData);
   
    projectData.forEach(data => {
        //<section box>
        const box = document.createElement('section');
        box.className = 'box';
        
        //<project card>
        const card = document.createElement('project-card');
        card.setAttribute('header', data.header);
        card.setAttribute('image', data.image);
        card.setAttribute('alt', data.alt);
        card.setAttribute('p', data.p);
        card.setAttribute('href', data.href || 'https://example.com');
        
        
        box.appendChild(card);
        
        
        container.appendChild(box);
    });
    
   
}
